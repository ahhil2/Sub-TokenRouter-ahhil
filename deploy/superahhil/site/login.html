<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - SuperAHHilAi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      window.__onTurnstileReady = function () {
        window.dispatchEvent(new Event("turnstile-ready"));
      };
    </script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__onTurnstileReady"
      async
      defer
    ></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020303;
        --line: rgba(255, 255, 255, 0.14);
        --line-strong: rgba(255, 255, 255, 0.24);
        --text: #f7f7f2;
        --muted: rgba(255, 255, 255, 0.64);
        --dim: rgba(255, 255, 255, 0.42);
        --cyan: #8eeaff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-width: 320px;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% -8%, rgba(255, 255, 255, 0.16), transparent 18%),
          radial-gradient(circle at 18% 75%, rgba(65, 205, 255, 0.08), transparent 22%),
          radial-gradient(circle at 88% 30%, rgba(145, 255, 200, 0.055), transparent 20%),
          #020303;
      }

      .app::before {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        content: "";
        background:
          linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 20px 20px;
        mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 66%, transparent 100%);
        transform: perspective(620px) rotateX(62deg) scale(1.82) translateY(-140px);
        transform-origin: top center;
      }

      .app::after {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        content: "";
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.28) 1px, transparent 1.8px),
          linear-gradient(to bottom, transparent 0 34%, rgba(255, 255, 255, 0.08) 34.1%, transparent 34.3%);
        background-size: 220px 220px, 100% 1px;
        opacity: 0.22;
      }

      .pyramid {
        position: absolute;
        top: 16px;
        left: 50%;
        z-index: 0;
        width: min(560px, 44vw);
        height: min(440px, 46vh);
        pointer-events: none;
        opacity: 0.34;
        transform: translateX(-50%);
        clip-path: polygon(50% 0, 0 100%, 100% 100%);
        background:
          repeating-conic-gradient(from -4deg at 50% 0, rgba(255,255,255,.16) 0deg 0.28deg, transparent 0.3deg 2.2deg);
        mask-image: linear-gradient(to bottom, black, transparent 86%);
      }

      .wrap {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1.32fr) minmax(420px, 500px);
        gap: clamp(34px, 6vw, 110px);
        align-items: center;
        width: min(1488px, calc(100% - 128px));
        margin: 0 auto;
        padding: 44px 0 52px;
      }

      .brand {
        position: absolute;
        top: 48px;
        left: 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        display: grid;
        width: 50px;
        height: 50px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.035);
        font-size: 21px;
        font-weight: 900;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      }

      .brand-title {
        display: block;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .brand-subtitle {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 15px;
      }

      .home-link {
        position: absolute;
        top: 50px;
        right: 0;
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.055);
        padding: 0 20px;
        color: var(--text);
        font-size: 15px;
        font-weight: 800;
        transition: transform .18s ease, background .18s ease, border-color .18s ease;
      }

      .home-link:hover {
        border-color: rgba(255,255,255,.4);
        background: rgba(255,255,255,.09);
        transform: translateY(-1px);
      }

      .hero {
        max-width: 850px;
        padding-top: 88px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 36px;
        border: 1px solid rgba(142, 234, 255, 0.28);
        border-radius: 999px;
        background: rgba(8, 41, 45, 0.68);
        padding: 0 16px;
        color: #dffbff;
        font-size: 13px;
        font-weight: 800;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 28px rgba(44,220,255,.08);
      }

      .pill-dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--cyan);
        box-shadow: 0 0 18px var(--cyan);
      }

      .hero h1 {
        max-width: 900px;
        margin: 28px 0 22px;
        color: #fff;
        font-size: clamp(58px, 7.2vw, 96px);
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.06;
      }

      .hero p {
        max-width: 790px;
        margin: 0;
        color: rgba(255,255,255,.78);
        font-size: clamp(18px, 1.7vw, 23px);
        font-weight: 500;
        line-height: 1.64;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        max-width: 748px;
        margin-top: 34px;
      }

      .metric {
        min-height: 88px;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 15px;
        background: rgba(0,0,0,.36);
        padding: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      }

      .metric strong {
        display: block;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .metric span {
        display: block;
        margin-top: 9px;
        color: rgba(255,255,255,.72);
        font-size: 13px;
        font-weight: 800;
      }

      .form-card {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 24px;
        background:
          linear-gradient(135deg, rgba(255,255,255,.065), transparent 42%),
          rgba(12, 13, 13, 0.88);
        padding: 32px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.48),
          inset 0 1px 0 rgba(255,255,255,.07);
        backdrop-filter: blur(18px);
        transform: translateY(34px);
      }

      .form-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 28px;
      }

      .form-head h2 {
        margin: 0 0 10px;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.055em;
      }

      .form-head p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        font-weight: 500;
      }

      .status-badge {
        flex: 0 0 auto;
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        border: 1px solid rgba(65, 205, 255, .3);
        border-radius: 999px;
        background: rgba(10, 34, 48, .64);
        padding: 0 14px;
        color: #d9f6ff;
        font-size: 14px;
        font-weight: 900;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        height: 64px;
        margin-bottom: 24px;
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 15px;
        background: rgba(0,0,0,.26);
        padding: 7px;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: rgba(255,255,255,.76);
        font-size: 18px;
        font-weight: 900;
      }

      .tab-active {
        background: #fff;
        color: #050505;
        box-shadow: 0 18px 36px rgba(255,255,255,.12);
      }

      .form {
        display: grid;
        gap: 17px;
      }

      .field {
        display: grid;
        gap: 9px;
      }

      .field label {
        color: rgba(255,255,255,.88);
        font-size: 17px;
        font-weight: 900;
      }

      .input-wrap {
        position: relative;
      }

      .input {
        width: 100%;
        height: 58px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 14px;
        outline: none;
        background: rgba(0, 4, 5, 0.72);
        padding: 0 18px;
        color: #fff;
        font-size: 18px;
        font-weight: 500;
        transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }

      .input::placeholder {
        color: rgba(255,255,255,.36);
      }

      .input:focus {
        border-color: rgba(165, 220, 255, .9);
        background: rgba(231, 240, 255, .96);
        color: #101215;
        box-shadow: 0 0 0 4px rgba(122, 205, 255, .14);
      }

      .input:focus::placeholder {
        color: rgba(0,0,0,.42);
      }

      .input:disabled {
        cursor: not-allowed;
        opacity: .55;
      }

      .password .input {
        padding-right: 54px;
      }

      .eye-btn {
        position: absolute;
        top: 50%;
        right: 16px;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 0;
        background: transparent;
        color: rgba(255,255,255,.72);
        transform: translateY(-50%);
      }

      .input:focus + .eye-btn {
        color: rgba(0,0,0,.62);
      }

      .form-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: -2px;
        color: rgba(255,255,255,.86);
        font-size: 15px;
        font-weight: 900;
      }

      .form-links a:hover {
        text-decoration: underline;
      }

      .primary-btn {
        display: inline-flex;
        width: 100%;
        height: 60px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 4px;
        border: 0;
        border-radius: 15px;
        background: #fff;
        color: #050505;
        font-size: 17px;
        font-weight: 900;
        box-shadow: 0 22px 46px rgba(255,255,255,.12);
        transition: transform .18s ease, background .18s ease;
      }

      .primary-btn:hover {
        background: rgba(255,255,255,.92);
        transform: translateY(-1px);
      }

      .primary-btn:disabled {
        cursor: not-allowed;
        opacity: .55;
        transform: none;
      }

      .footnote {
        margin: 17px 0 0;
        color: var(--dim);
        font-size: 13px;
        line-height: 1.7;
      }

      .toast {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 20;
        max-width: 360px;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 16px;
        background: #fff;
        padding: 13px 16px;
        color: #050505;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 24px 58px rgba(0,0,0,.38);
      }

      .toast-error {
        border-color: rgba(255, 100, 100, .34);
        background: #2a0909;
        color: #fff0f0;
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      .fade-up {
        animation: fade-up .75s cubic-bezier(.16, 1, .3, 1) both;
      }

      .delay-1 { animation-delay: .08s; }
      .delay-2 { animation-delay: .18s; }
      .delay-3 { animation-delay: .28s; }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 1180px) {
        .wrap {
          width: min(100% - 48px, 760px);
          grid-template-columns: 1fr;
          gap: 34px;
          padding-top: 128px;
        }

        .hero {
          max-width: none;
          padding-top: 0;
        }

        .hero h1 {
          font-size: clamp(42px, 9vw, 68px);
        }

        .form-card {
          max-width: 620px;
          margin: 0 auto;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .wrap {
          width: min(100% - 28px, 760px);
          padding: 104px 0 28px;
        }

        .brand {
          top: 24px;
        }

        .brand-mark {
          width: 42px;
          height: 42px;
        }

        .brand-title {
          font-size: 19px;
        }

        .brand-subtitle {
          font-size: 12px;
        }

        .home-link {
          top: 25px;
          min-height: 40px;
          padding: 0 13px;
          font-size: 13px;
        }

        .hero {
          display: none;
        }

        .form-card {
          padding: 22px;
          border-radius: 20px;
          transform: translateY(0);
        }

        .form-head {
          flex-direction: column;
          margin-bottom: 22px;
        }

        .form-head h2 {
          font-size: 29px;
        }

        .tabs {
          height: 58px;
        }

        .tab {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;
      const { createRoot } = ReactDOM;
      const { ArrowRight, Eye, EyeOff, Loader2 } = LucideReact;

      const defaultStatus = {
        system_name: "SuperAHHilAi",
        password_login_enabled: true,
        register_enabled: true,
        turnstile_check: false,
        turnstile_site_key: "",
      };

      async function readApiResponse(response) {
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error((payload && payload.message) || `请求失败 (${response.status})`);
        }
        if (payload && typeof payload.code === "number") {
          if (payload.code !== 0) {
            throw new Error(payload.message || "请求失败");
          }
          return payload.data;
        }
        return payload;
      }

      function persistAuthSession(data) {
        if (!data || !data.access_token || !data.user) {
          throw new Error("登录响应缺少认证信息");
        }
        const { run_mode, ...user } = data.user;
        localStorage.setItem("auth_token", data.access_token);
        localStorage.setItem("auth_user", JSON.stringify(user));
        if (data.refresh_token) {
          localStorage.setItem("refresh_token", data.refresh_token);
        } else {
          localStorage.removeItem("refresh_token");
        }
        if (data.expires_in) {
          localStorage.setItem("token_expires_at", String(Date.now() + data.expires_in * 1000));
        } else {
          localStorage.removeItem("token_expires_at");
        }
        localStorage.removeItem("pending_auth_session");
      }

      function App() {
        const [status, setStatus] = useState(defaultStatus);
        const [loadingStatus, setLoadingStatus] = useState(true);
        const [toast, setToast] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [turnstileToken, setTurnstileToken] = useState("");
        const [showPassword, setShowPassword] = useState(false);
        const [form, setForm] = useState({ email: "", password: "" });
        const [twoFactor, setTwoFactor] = useState({ required: false, tempToken: "", code: "" });
        const turnstileRef = useRef(null);
        const widgetRef = useRef(null);

        useEffect(() => {
          fetch("/api/v1/settings/public", { credentials: "same-origin" })
            .then(readApiResponse)
            .then((settings) => {
              setStatus({
                ...defaultStatus,
                system_name: settings.site_name || defaultStatus.system_name,
                register_enabled: settings.registration_enabled !== false,
                turnstile_check: Boolean(settings.turnstile_enabled),
                turnstile_site_key: settings.turnstile_site_key || "",
              });
            })
            .catch((error) => showToast(error.message || "无法读取 Sub2API 站点配置", "error"))
            .finally(() => setLoadingStatus(false));
        }, []);

        useEffect(() => {
          if (!status.turnstile_check || !status.turnstile_site_key) return;
          const renderTurnstile = () => {
            if (!window.turnstile || !turnstileRef.current || widgetRef.current) return;
            widgetRef.current = window.turnstile.render(turnstileRef.current, {
              sitekey: status.turnstile_site_key,
              theme: "dark",
              callback: (token) => setTurnstileToken(token),
              "expired-callback": () => setTurnstileToken(""),
              "error-callback": () => setTurnstileToken(""),
            });
          };
          renderTurnstile();
          window.addEventListener("turnstile-ready", renderTurnstile);
          return () => window.removeEventListener("turnstile-ready", renderTurnstile);
        }, [status.turnstile_check, status.turnstile_site_key]);

        function showToast(message, type = "success") {
          setToast({ message, type });
          window.clearTimeout(showToast.timer);
          showToast.timer = window.setTimeout(() => setToast(null), 3600);
        }

        function updateField(name, value) {
          setForm((current) => ({ ...current, [name]: value }));
        }

        function requireTurnstile() {
          if (status.turnstile_check && !turnstileToken) {
            showToast("请稍后几秒重试，Turnstile 正在检查用户环境。", "error");
            return false;
          }
          return true;
        }

        async function submitLogin(event) {
          event.preventDefault();

          if (!status.password_login_enabled) {
            showToast("当前站点未开放账号密码登录。", "error");
            return;
          }
          if (!form.email.trim() || !form.password) {
            showToast("请输入邮箱与密码。", "error");
            return;
          }
          if (!requireTurnstile()) return;

          setSubmitting(true);
          try {
            const res = await fetch("/api/v1/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({
                email: form.email.trim(),
                password: form.password,
                turnstile_token: status.turnstile_check ? turnstileToken : undefined,
              }),
            });
            const data = await readApiResponse(res);
            if (data && data.requires_2fa) {
              setTwoFactor({ required: true, tempToken: data.temp_token || "", code: "" });
              showToast("请输入身份验证器中的 6 位验证码。");
              return;
            }
            persistAuthSession(data);
            showToast("登录成功，正在进入控制台。");
            setTimeout(() => { window.location.href = "/dashboard"; }, 500);
          } catch (error) {
            showToast(error.message || "登录失败，请重试。", "error");
          } finally {
            setSubmitting(false);
          }
        }

        async function submitTwoFactor(event) {
          event.preventDefault();
          if (!/^\d{6}$/.test(twoFactor.code.trim())) {
            showToast("请输入 6 位验证码。", "error");
            return;
          }
          setSubmitting(true);
          try {
            const res = await fetch("/api/v1/auth/login/2fa", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({
                temp_token: twoFactor.tempToken,
                totp_code: twoFactor.code.trim(),
              }),
            });
            const data = await readApiResponse(res);
            persistAuthSession(data);
            showToast("验证成功，正在进入控制台。");
            setTimeout(() => { window.location.href = "/dashboard"; }, 500);
          } catch (error) {
            showToast(error.message || "两步验证失败，请重试。", "error");
          } finally {
            setSubmitting(false);
          }
        }

        return (
          <main className="app">
            <div className="pyramid"></div>
            <div className="wrap">
              <a className="brand fade-up delay-1" href="/">
                <span className="brand-mark">I</span>
                <span>
                  <span className="brand-title">{status.system_name || "SuperAHHilAi"}</span>
                  <span className="brand-subtitle">AI API relay console</span>
                </span>
              </a>
              <a className="home-link fade-up delay-1" href="/">返回首页</a>

              <section className="hero fade-up delay-2">
                <div className="pill">
                  <span className="pill-dot"></span>
                  统一账户 · 控制台入口
                </div>
                <h1>回到你的 AI 工具中转账户</h1>
                <p>
                  登录后创建密钥、查看额度与请求日志，把 Claude Code、Codex、Gemini CLI 与图像模型统一接到同一套账户。
                </p>
                <div className="metrics">
                  <div className="metric">
                    <strong>统一</strong>
                    <span>账户与密钥</span>
                  </div>
                  <div className="metric">
                    <strong>实时</strong>
                    <span>额度日志</span>
                  </div>
                  <div className="metric">
                    <strong>稳定</strong>
                    <span>模型状态</span>
                  </div>
                </div>
              </section>

              <section className="form-card fade-up delay-3">
                <div className="form-head">
                  <div>
                    <h2>登录账户</h2>
                    <p>输入用户名或邮箱与密码</p>
                  </div>
                </div>

                <div className="tabs">
                  <button className="tab tab-active" type="button">登录</button>
                  <a className="tab" href="/register">注册</a>
                </div>

                <form className="form" onSubmit={twoFactor.required ? submitTwoFactor : submitLogin}>
                  <Field
                    label="邮箱"
                    type="email"
                    placeholder="you@example.com"
                    value={form.email}
                    onChange={(value) => updateField("email", value)}
                    disabled={loadingStatus || twoFactor.required}
                  />

                  <PasswordField
                    label="密码"
                    placeholder="输入密码"
                    value={form.password}
                    show={showPassword}
                    onToggle={() => setShowPassword((value) => !value)}
                    onChange={(value) => updateField("password", value)}
                    disabled={twoFactor.required}
                  />

                  {twoFactor.required && (
                    <Field
                      label="两步验证码"
                      placeholder="输入 6 位验证码"
                      value={twoFactor.code}
                      onChange={(value) => setTwoFactor((current) => ({ ...current, code: value.replace(/\D/g, "").slice(0, 6) }))}
                    />
                  )}

                  {status.turnstile_check && (
                    <div className="field">
                      <label>安全验证</label>
                      <div ref={turnstileRef}></div>
                    </div>
                  )}

                  <div className="form-links">
                    <a href="/forgot-password">忘记密码？</a>
                    <a href="/register">没有账户，去注册</a>
                  </div>

                  <button
                    className="primary-btn"
                    type="submit"
                    disabled={submitting || loadingStatus}
                  >
                    {submitting ? (
                      <>
                        <Loader2 className="spin" size={20} />
                        {twoFactor.required ? "正在验证" : "正在登录"}
                      </>
                    ) : (
                      <>
                        {twoFactor.required ? "验证并登录" : "登录账户"}
                        <ArrowRight size={20} />
                      </>
                    )}
                  </button>
                </form>

                <p className="footnote">
                  登录成功后将进入 Sub2API 控制台；启用两步验证的账户可直接在此完成验证。
                </p>
              </section>
            </div>

            {toast && (
              <div className={`toast ${toast.type === "error" ? "toast-error" : ""}`}>
                {toast.message}
              </div>
            )}
          </main>
        );
      }

      function Field({ label, placeholder, type = "text", value, onChange, disabled = false }) {
        return (
          <div className="field">
            <label>{label}</label>
            <input
              className="input"
              type={type}
              placeholder={placeholder}
              value={value}
              disabled={disabled}
              onChange={(event) => onChange(event.target.value)}
            />
          </div>
        );
      }

      function PasswordField({ label, placeholder, value, show, onToggle, onChange, disabled = false }) {
        return (
          <div className="field password">
            <label>{label}</label>
            <div className="input-wrap">
              <input
                className="input"
                type={show ? "text" : "password"}
                placeholder={placeholder}
                value={value}
                disabled={disabled}
                onChange={(event) => onChange(event.target.value)}
              />
              <button className="eye-btn" type="button" onClick={onToggle} aria-label={show ? "隐藏密码" : "显示密码"}>
                {show ? <EyeOff size={20} /> : <Eye size={20} />}
              </button>
            </div>
          </div>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
